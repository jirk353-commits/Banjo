name: Build ConvertWithMoss tool (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  CWM_COMMIT: 38cdb927c37a790a26b6e7d3cc696afa38012037
jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: |
          git init cwm && cd cwm
          git remote add origin https://github.com/git-moss/ConvertWithMoss.git
          git fetch --depth 1 origin "$CWM_COMMIT" && git checkout -q FETCH_HEAD
          mvn -B -q -DskipTests package
          cd .. && mkdir -p tool && cp -r cwm/target/lib tool/lib && cp -rL "$JAVA_HOME" tool/jdk && ls tool/jdk/bin | head
          tar czf cwm-tool-linux.tar.gz tool && ls -la cwm-tool-linux.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete cwm-tool --yes --cleanup-tag || true
          gh release create cwm-tool cwm-tool-linux.tar.gz --title "temporary tool" --notes "temporary" --prerelease
